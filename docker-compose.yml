version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: whatsapp_db
    restart: always
    environment:
      POSTGRES_USER: neonize_user
      POSTGRES_PASSWORD: neonize_password
      POSTGRES_DB: whatsapp_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    container_name: whatsapp_bot_app
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://neonize_user:neonize_password@db:5432/whatsapp_bot?sslmode=disable
    # Estas duas opções abaixo são CRUTIAIS para conseguir ver o QR Code no terminal
    stdin_open: true
    tty: true
    volumes:
      - .:/app

volumes:
  postgres_data:
